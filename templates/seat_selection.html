<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura – Select Your Seat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.08);
  --text:#e2e8f0;--muted:#64748b;--accent:#8b5cf6;--accent-glow:rgba(139,92,246,.45);
  --cyan:#06b6d4;--cyan-dim:rgba(6,182,212,.15);
  --gold:#f59e0b;--gold-dim:rgba(245,158,11,.15);
  --occupied:#1e293b;--selected:#8b5cf6;--selected-glow:rgba(139,92,246,.5);
  --exit:#22c55e;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;
  background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.header h1{font-size:1.15rem;font-weight:600;background:linear-gradient(135deg,#c084fc,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.flight-info{display:flex;gap:24px;align-items:center}
.flight-info .route{font-size:.95rem;font-weight:600;letter-spacing:.5px}
.flight-info .detail{font-size:.78rem;color:var(--muted)}
.steps{display:flex;gap:8px;align-items:center}
.step{width:28px;height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
.step.done{background:var(--accent)}
.step.active{background:linear-gradient(90deg,var(--accent),var(--cyan));animation:pulse-bar 2s infinite}
@keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.5}}

/* ── LAYOUT ── */
.main{display:flex;gap:28px;padding:28px 32px;max-width:1200px;margin:0 auto}
.cabin-wrapper{flex:1;display:flex;flex-direction:column;align-items:center}
.sidebar{width:280px;display:flex;flex-direction:column;gap:16px}

/* ── AIRCRAFT ── */
.aircraft{position:relative;width:340px}
.nose{width:200px;height:60px;margin:0 auto -8px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
  border-radius:50% 50% 0 0;border:1px solid var(--border);border-bottom:none}
.fuselage{background:rgba(255,255,255,.025);border:1px solid var(--border);
  border-radius:12px;padding:20px 16px 28px;position:relative;overflow:hidden}
.fuselage::before{content:'';position:absolute;top:0;left:50%;width:1px;height:100%;
  background:rgba(255,255,255,.04);transform:translateX(-50%)}
.section-label{text-align:center;font-size:.65rem;font-weight:600;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);margin:12px 0 8px;padding:4px;
  background:rgba(255,255,255,.03);border-radius:6px}

/* ── ROW ── */
.row{display:flex;align-items:center;justify-content:center;gap:0;margin:3px 0}
.row-num{width:22px;text-align:center;font-size:.65rem;color:var(--muted);font-weight:500}
.aisle{width:32px}

/* ── SEAT ── */
.seat{width:36px;height:36px;margin:2px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:600;
  transition:all .25s ease;position:relative;border:1.5px solid transparent}

.seat.available{background:var(--cyan-dim);border-color:rgba(6,182,212,.3);color:var(--cyan)}
.seat.available:hover{background:rgba(6,182,212,.25);border-color:var(--cyan);
  transform:scale(1.12);box-shadow:0 0 14px rgba(6,182,212,.3)}

.seat.premium{background:var(--gold-dim);border-color:rgba(245,158,11,.3);color:var(--gold)}
.seat.premium:hover{background:rgba(245,158,11,.25);border-color:var(--gold);
  transform:scale(1.12);box-shadow:0 0 14px rgba(245,158,11,.3)}

.seat.occupied{background:var(--occupied);border-color:rgba(255,255,255,.05);
  color:rgba(255,255,255,.15);cursor:not-allowed}

.seat.selected{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:#a78bfa;
  color:#fff;transform:scale(1.12);box-shadow:0 0 20px var(--selected-glow),0 0 40px rgba(139,92,246,.2);
  animation:seat-pop .35s ease}
@keyframes seat-pop{0%{transform:scale(.8)}50%{transform:scale(1.18)}100%{transform:scale(1.12)}}

.seat.exit-row{border-bottom:2px solid var(--exit)}

/* ── SIDEBAR CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;
  backdrop-filter:blur(16px)}
.card h3{font-size:.82rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .icon{font-size:1rem}

/* Legend */
.legend-items{display:flex;flex-direction:column;gap:10px}
.legend-item{display:flex;align-items:center;gap:10px;font-size:.78rem}
.legend-swatch{width:24px;height:24px;border-radius:6px;flex-shrink:0}
.sw-available{background:var(--cyan-dim);border:1.5px solid rgba(6,182,212,.3)}
.sw-premium{background:var(--gold-dim);border:1.5px solid rgba(245,158,11,.3)}
.sw-selected{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:1.5px solid #a78bfa}
.sw-occupied{background:var(--occupied);border:1.5px solid rgba(255,255,255,.05)}
.sw-exit{background:var(--cyan-dim);border:1.5px solid rgba(6,182,212,.3);border-bottom:2px solid var(--exit)}
.legend-price{margin-left:auto;color:var(--muted);font-size:.72rem}

/* Selection summary */
.summary-seat{display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);
  border-radius:10px;margin-top:8px;font-size:.82rem}
.summary-seat .seat-code{font-weight:700;color:var(--accent);font-size:.95rem}
.summary-seat .seat-type{color:var(--muted);font-size:.72rem}
.no-seat{color:var(--muted);font-size:.8rem;font-style:italic;margin-top:8px}
.total-row{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--border);font-size:.85rem;font-weight:600}
.total-price{color:var(--cyan);font-size:1rem}

/* Passenger tabs */
.pax-tabs{display:flex;gap:6px;margin-bottom:14px}
.pax-tab{flex:1;padding:8px;text-align:center;border-radius:8px;font-size:.72rem;
  font-weight:600;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid transparent;
  transition:all .2s}
.pax-tab.active{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.3);color:var(--accent)}
.pax-tab .check{color:var(--exit);margin-left:4px}

/* Button */
.btn-continue{width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;
  font-size:.9rem;font-weight:600;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  box-shadow:0 4px 20px rgba(139,92,246,.3);transition:all .3s}
.btn-continue:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(139,92,246,.45)}
.btn-continue:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-skip{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;
  background:transparent;color:var(--muted);font-family:inherit;font-size:.78rem;
  cursor:pointer;margin-top:8px;transition:all .2s}
.btn-skip:hover{border-color:rgba(255,255,255,.2);color:var(--text)}

/* ── TOOLTIP ── */
.tooltip{position:fixed;padding:8px 12px;background:rgba(15,23,42,.95);border:1px solid var(--border);
  border-radius:8px;font-size:.72rem;pointer-events:none;z-index:100;opacity:0;
  transition:opacity .15s;backdrop-filter:blur(10px)}
.tooltip.show{opacity:1}
.tooltip .tt-seat{font-weight:700;color:var(--accent)}
.tooltip .tt-type{color:var(--muted)}
.tooltip .tt-price{color:var(--cyan);font-weight:600}

@media(max-width:768px){
  .main{flex-direction:column;align-items:center;padding:16px}
  .sidebar{width:100%;max-width:360px}
  .aircraft{width:300px}
  .seat{width:30px;height:30px;font-size:.55rem}
  .aisle{width:24px}
}
</style>
</head>
<body>

<div class="header">
  <button id="btnBack" class="btn-back" style="background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;">
    ← Back
  </button>
  <h1>✈ Aura</h1>
  <div class="flight-info">
    <div><div class="route" id="hdrRoute"></div><div class="detail" id="hdrFlight"></div></div>
    <div><div class="route" id="hdrTime"></div><div class="detail" id="hdrCabin"></div></div>
  </div>
  <div class="steps">
    <div class="step done"></div><div class="step done"></div><div class="step active"></div><div class="step"></div>
  </div>
</div>

<div class="main">
  <div class="cabin-wrapper">
    <div class="aircraft">
      <div class="nose"></div>
      <div class="fuselage" id="cabin"></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="card">
      <h3><span class="icon">🎫</span> <span data-t="seat_title">Choose seats (demo)</span></h3>
      <div class="pax-tabs" id="paxTabs"></div>
      <div id="selectionSummary"></div>
      <div class="total-row"><span data-t="seat_fees">Seat fees (sample)</span><span class="total-price" id="totalPrice">₹0</span></div>
    </div>

    <div class="card">
      <h3><span class="icon">📍</span> Legend</h3>
      <div class="legend-items">
        <div class="legend-item"><div class="legend-swatch sw-available"></div><span data-t="seat_available">Available</span><span class="legend-price" data-t="seat_free">Free</span></div>
        <div class="legend-item"><div class="legend-swatch sw-premium"></div><span data-t="seat_extra">Extra legroom</span><span class="legend-price">+₹800</span></div>
        <div class="legend-item"><div class="legend-swatch sw-exit"></div><span data-t="seat_exit">Exit row</span><span class="legend-price">+₹600</span></div>
        <div class="legend-item"><div class="legend-swatch sw-selected"></div><span data-t="seat_yours">Your selection</span></div>
        <div class="legend-item"><div class="legend-swatch sw-occupied"></div><span data-t="seat_occupied">Taken</span></div>
      </div>
    </div>

    <button class="btn-continue" id="btnContinue" disabled data-t="seat_save">Save seats</button>
    <button class="btn-skip" id="btnSkip" data-t="seat_skip">Skip (assign at check-in)</button>
  </div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-seat" id="ttSeat"></div>
  <div class="tt-type" id="ttType"></div>
  <div class="tt-price" id="ttPrice"></div>
</div>

<script>
// Flight + passenger count come from the chat (query param "p"); labels from /api/i18n.
let PARAMS = {};
try { PARAMS = JSON.parse(new URLSearchParams(location.search).get("p") || "{}"); } catch (e) { PARAMS = {}; }
let T = {};
const tr = (k, v) => (T[k] || k).replace(/\{(\w+)\}/g, (_, x) => (v && v[x] != null ? v[x] : ""));
const PAX = Math.max(1, Math.min(9, parseInt(PARAMS.passengers || 1, 10) || 1));
const PASSENGERS = Array.from({length: PAX}, (_, i) => ({id: i + 1, name: "Passenger " + (i + 1)}));
function setText(id, v) { const n = document.getElementById(id); if (n) n.textContent = v || ""; }
setText("hdrRoute", PARAMS.route); setText("hdrFlight", [PARAMS.flight, PARAMS.airline, PARAMS.date].filter(Boolean).join(" · "));
setText("hdrTime", PARAMS.time); setText("hdrCabin", PARAMS.cabin);
fetch("/api/i18n/" + (PARAMS.lang || "en")).then(r => r.json()).then(d => {
  T = d.strings || {};
  document.querySelectorAll("[data-t]").forEach(n => { if (T[n.dataset.t]) n.textContent = T[n.dataset.t]; });
  const back = document.getElementById("btnBack"); if (back && T.seat_back) back.textContent = T.seat_back;
  PASSENGERS.forEach((p, i) => p.name = tr("seat_passenger", {n: i + 1}));
  renderAll();
}).catch(() => {});
// Deterministic occupancy per flight so the map doesn't change on reopen.
let _seed = Array.from(String(PARAMS.flight || "demo")).reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
Math.random = function () { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; };
let activePax = 0; // index into PASSENGERS
const selections = new Array(PASSENGERS.length).fill(null); // seatId per pax

// Seat layout: Business (2-2) rows 1-3, Premium/Exit row 12-13 (3-3), Economy (3-3) rows 4-25
const COLS_BIZ = ["A","B","|","C","D"];
const COLS_ECO = ["A","B","C","|","D","E","F"];

function makeSeatMap(){
  const map = [];
  // Business: rows 1-3
  for(let r=1;r<=3;r++){
    const seats = COLS_BIZ.map(c=>{
      if(c==="|") return {type:"aisle"};
      const occ = Math.random()<.3;
      return {id:`${r}${c}`,row:r,col:c,cls:"business",occupied:occ,premium:false,exit:false,price:0};
    });
    map.push({row:r,section:"business",seats});
  }
  // Economy: rows 4-25
  for(let r=4;r<=25;r++){
    const isExit = r===12||r===13;
    const isPremium = r>=4&&r<=6;
    const seats = COLS_ECO.map(c=>{
      if(c==="|") return {type:"aisle"};
      const occ = Math.random()<.35;
      let price = 0;
      if(isPremium) price = 800;
      else if(isExit) price = 600;
      return {id:`${r}${c}`,row:r,col:c,cls:"economy",occupied:occ,premium:isPremium,exit:isExit,price};
    });
    map.push({row:r,section:isPremium?"premium":isExit?"exit":"economy",seats});
  }
  return map;
}

const seatMap = makeSeatMap();

function renderCabin(){
  const cabin = document.getElementById("cabin");
  cabin.innerHTML = "";
  let lastSection = "";
  seatMap.forEach(rowData=>{
    const sec = rowData.section;
    if(sec!==lastSection){
      const label = document.createElement("div");
      label.className = "section-label";
      label.textContent = sec==="business"?"Business Class":sec==="premium"?"Extra Legroom":sec==="exit"?"Exit Row":"Economy";
      cabin.appendChild(label);
      lastSection = sec;
    }
    const rowEl = document.createElement("div");
    rowEl.className = "row";
    // Row number left
    const numL = document.createElement("div");
    numL.className = "row-num";
    numL.textContent = rowData.row;
    rowEl.appendChild(numL);

    rowData.seats.forEach(s=>{
      if(s.type==="aisle"){
        const a = document.createElement("div");
        a.className = "aisle";
        rowEl.appendChild(a);
        return;
      }
      const el = document.createElement("div");
      el.className = "seat";
      el.textContent = s.col;
      el.dataset.id = s.id;

      const selIdx = selections.indexOf(s.id);
      if(selIdx>=0){
        el.classList.add("selected");
        el.textContent = (selIdx+1);
      } else if(s.occupied){
        el.classList.add("occupied");
      } else if(s.premium){
        el.classList.add("premium");
      } else {
        el.classList.add("available");
      }
      if(s.exit) el.classList.add("exit-row");

      if(!s.occupied){
        el.addEventListener("click",()=>selectSeat(s));
        el.addEventListener("mouseenter",e=>showTooltip(e,s));
        el.addEventListener("mouseleave",hideTooltip);
      }
      rowEl.appendChild(el);
    });

    const numR = document.createElement("div");
    numR.className = "row-num";
    numR.textContent = rowData.row;
    rowEl.appendChild(numR);
    cabin.appendChild(rowEl);
  });
}

function selectSeat(s){
  const prev = selections[activePax];
  if(prev===s.id) { selections[activePax]=null; } // deselect
  else {
    // If another pax has this seat, swap
    const otherIdx = selections.indexOf(s.id);
    if(otherIdx>=0) selections[otherIdx] = prev;
    selections[activePax] = s.id;
  }
  // Auto-advance to next unselected pax
  const nextEmpty = selections.findIndex(x=>x===null);
  if(nextEmpty>=0) activePax = nextEmpty;
  renderAll();
}

function renderPaxTabs(){
  const el = document.getElementById("paxTabs");
  el.innerHTML = "";
  PASSENGERS.forEach((p,i)=>{
    const tab = document.createElement("div");
    tab.className = "pax-tab"+(i===activePax?" active":"");
    tab.innerHTML = `P${i+1}${selections[i]?'<span class="check"> ✓</span>':""}`;
    tab.onclick = ()=>{ activePax=i; renderAll(); };
    el.appendChild(tab);
  });
}

function renderSummary(){
  const el = document.getElementById("selectionSummary");
  let html = "";
  let total = 0;
  PASSENGERS.forEach((p,i)=>{
    if(selections[i]){
      const s = findSeat(selections[i]);
      const price = s?s.price:0;
      total += price;
      const typeLabel = s?(s.premium?"Extra Legroom":s.exit?"Exit Row":s.cls==="business"?"Business":"Standard"):"";
      html += `<div class="summary-seat">
        <div><div class="seat-code">${selections[i]}</div><div class="seat-type">${p.name}</div></div>
        <div>${price>0?"₹"+price:(T.seat_free||"Free")}</div>
      </div>`;
    } else {
      html += `<div class="no-seat">${p.name}: ${T.seat_none || "No seat yet"}</div>`;
    }
  });
  el.innerHTML = html;
  document.getElementById("totalPrice").textContent = total>0?"₹"+total.toLocaleString("en-IN"):(T.seat_free||"Free");
  document.getElementById("btnContinue").disabled = selections.some(x=>x===null);
}

function findSeat(id){
  for(const row of seatMap) for(const s of row.seats) if(s.id===id) return s;
  return null;
}

function showTooltip(e,s){
  const tt = document.getElementById("tooltip");
  document.getElementById("ttSeat").textContent = `Seat ${s.id}`;
  const type = s.premium?"Extra Legroom":s.exit?"Exit Row":s.cls==="business"?"Business Class":"Economy";
  document.getElementById("ttType").textContent = type;
  document.getElementById("ttPrice").textContent = s.price>0?`+₹${s.price}`:"Free";
  tt.classList.add("show");
  tt.style.left = (e.clientX+14)+"px";
  tt.style.top = (e.clientY-10)+"px";
}
function hideTooltip(){document.getElementById("tooltip").classList.remove("show")}

document.getElementById("btnContinue").addEventListener("click",()=>{
  // Demo only: seats are sent back to the chat and shown in the trip summary. Nothing is reserved.
  const seats = selections.map((id)=>({seat:id, price:findSeat(id)?.price||0}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ action: "seats_selected", leg: PARAMS.leg || 0, seats }, window.location.origin);
  }
});
document.getElementById("btnSkip").addEventListener("click", () => {
  if (window.parent && window.parent !== window) window.parent.postMessage({ action: "back_from_seat_selection" }, window.location.origin);
  else window.location.href = "/";
});

document.getElementById("btnBack").addEventListener("click", () => {
  // If loaded inside an iframe, tell the parent chat page we want to go back.
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ action: "back_from_seat_selection" }, window.location.origin);
  } else {
    // Fallback: standalone page, do the old-style API call + navigate.
    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "back_from_seat_selection" })
    }).then(() => {
      window.location.href = "/";
    });
  }
});

function renderAll(){renderCabin();renderPaxTabs();renderSummary();}
renderAll();
</script>
</body>
</html>
